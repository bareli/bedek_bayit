complete_task:
  fields:
    task_id:
      example: "a1b2c3d4e5"
      selector:
        text:
    entity_id:
      selector:
        entity:
          integration: bedek_bayit
    date:
      selector:
        date:
    note:
      selector:
        text:
    cost:
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "₪"

snooze_task:
  fields:
    task_id:
      selector:
        text:
    entity_id:
      selector:
        entity:
          integration: bedek_bayit
    days:
      selector:
        number:
          min: 1
          max: 365
          mode: box

remove_task:
  fields:
    task_id:
      selector:
        text:
    entity_id:
      selector:
        entity:
          integration: bedek_bayit

add_task:
  fields:
    name:
      required: true
      selector:
        text:
    template:
      selector:
        text:
    category:
      selector:
        select:
          translation_key: category
          options:
            - "climate"
            - "water"
            - "solar"
            - "safety"
            - "gas"
            - "kitchen"
            - "structure"
            - "religious"
            - "general"
    icon:
      selector:
        icon:
    schedule_type:
      default: "interval"
      selector:
        select:
          translation_key: schedule_type
          options:
            - "interval"
            - "holiday"
            - "yearly"
            - "entity"
    every:
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    unit:
      default: "months"
      selector:
        select:
          translation_key: unit
          options:
            - "days"
            - "weeks"
            - "months"
            - "years"
    holiday:
      selector:
        select:
          translation_key: holiday
          options:
            - "rosh_hashana"
            - "sukkot"
            - "hanukkah"
            - "purim"
            - "pesach"
            - "shavuot"
    month:
      selector:
        number:
          min: 1
          max: 12
          mode: box
    day:
      selector:
        number:
          min: 1
          max: 31
          mode: box
    offset_days:
      default: 0
      selector:
        number:
          min: -180
          max: 180
          mode: box
    source_entity:
      selector:
        entity:
          domain:
            - sensor
            - input_datetime
            - date
            - datetime
    last_done:
      selector:
        date:
    remind_days:
      selector:
        number:
          min: 0
          max: 365
          mode: box
    notes:
      selector:
        text:
          multiline: true

list_tasks:
