name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Validation
    # HACS downloads hacs.json / manifest.json unauthenticated: always fails on a private repo.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pip install -r requirements_test.txt
          python - <<'PY' > frontend_req.txt
          import json, os, homeassistant
          m = os.path.join(os.path.dirname(homeassistant.__file__), "components", "frontend", "manifest.json")
          print(next(r for r in json.load(open(m))["requirements"] if r.startswith("home-assistant-frontend")))
          PY
          pip install -r frontend_req.txt
      - name: Pytest
        run: pytest -q
